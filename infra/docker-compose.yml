name: ecommerce-local

services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ECOMMERCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_fresh:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECOMMERCE_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0.16
    container_name: ecommerce-mongo
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ ! -f /tmp/mongodb-keyfile ]; then
          printf '%s\n' "$$MONGO_REPLICA_SET_KEY" > /tmp/mongodb-keyfile
          chown mongodb:mongodb /tmp/mongodb-keyfile
          chmod 400 /tmp/mongodb-keyfile
        fi
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:-localdevelopmentmongoreplicasetkey0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcd}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_fresh:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${MONGO_ROOT_USERNAME} --password ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin --eval 'try { rs.status().ok } catch (e) { if (e.codeName === \"NotYetInitialized\") { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}).ok } else { quit(1) } }'"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ecommerce-kafka
    restart: unless-stopped
    ports:
      - "9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10


  catalog-service:
    build:
      context: ../services/catalog-service
    container_name: ecommerce-catalog-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ECOMMERCE_POSTGRES_CATALOG_DB:-catalog_db}
      SPRING_DATASOURCE_USERNAME: ${ECOMMERCE_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_KAFKA_ENABLED: ${APP_KAFKA_ENABLED:-true}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  cart-service:
    build:
      context: ../services/cart-service
    container_name: ecommerce-cart-service
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CART_TTL_SECONDS: "86400"
      APP_JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8080
    ports:
      - "8001:8080"
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10


  auth-service:
    build:
      context: ../services/auth-service
    container_name: ecommerce-auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ECOMMERCE_POSTGRES_AUTH_DB}
      SPRING_DATASOURCE_USERNAME: ${ECOMMERCE_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  inventory-service:
    build:
      context: ../services/inventory-service
    container_name: ecommerce-inventory-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ECOMMERCE_POSTGRES_INVENTORY_DB}
      SPRING_DATASOURCE_USERNAME: ${ECOMMERCE_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ../services/order-service
    container_name: ecommerce-order-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ECOMMERCE_POSTGRES_ORDER_DB}
      SPRING_DATASOURCE_USERNAME: ${ECOMMERCE_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ECOMMERCE_POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8080
      SERVER_PORT: "8080"
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ../services/payment-service
    container_name: ecommerce-payment-service
    restart: unless-stopped
    environment:
      PAYMENT_DATABASE_URL: postgresql+psycopg://${ECOMMERCE_POSTGRES_USER}:${ECOMMERCE_POSTGRES_PASSWORD}@postgres:5432/${ECOMMERCE_POSTGRES_PAYMENT_DB}
      APP_JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PAYMENT_TOPIC: payment-events
      KAFKA_CONSUMER_GROUP_ID: payment-service-group
    ports:
      - "8002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: ../services/notification-service
    container_name: ecommerce-notification-service
    restart: unless-stopped
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+psycopg://${ECOMMERCE_POSTGRES_USER}:${ECOMMERCE_POSTGRES_PASSWORD}@postgres:5432/${ECOMMERCE_POSTGRES_NOTIFICATION_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDER_TOPIC: order-events
      KAFKA_CONSUMER_GROUP_ID: notification-service-group
      NOTIFICATION_EMAIL_BACKEND: ${NOTIFICATION_EMAIL_BACKEND:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  search-service:
    build:
      context: ../services/search-service
    container_name: ecommerce-search-service
    restart: unless-stopped
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: products
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CATALOG_TOPIC: catalog-events
      KAFKA_CONSUMER_GROUP_ID: search-service-group
    ports:
      - "8003:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  wishlist-service:
    build:
      context: ../services/wishlist-service
    container_name: ecommerce-wishlist-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_WISHLIST_DB:-wishlist_db}?authSource=admin&replicaSet=rs0
      APP_JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8080
      WISHLIST_MAX_PAGE_SIZE: "100"
    ports:
      - "8004:8080"
    depends_on:
      mongo:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  review-service:
    build:
      context: ../services/review-service
    container_name: ecommerce-review-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_REVIEW_DB:-review_db}?authSource=admin&replicaSet=rs0
      APP_JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REVIEW_TOPIC: review-events
    ports:
      - "8005:8080"
    depends_on:
      mongo:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ../services/api-gateway
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      wishlist-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  kafka_data:
  elasticsearch_data:
  postgres_data_fresh:
  mongo_data_fresh:

networks:
  ecommerce-network:
    driver: bridge
