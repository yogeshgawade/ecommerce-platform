spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - RemoveResponseHeader=Server
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
          routes:
            - id: review-service
              uri: http://review-service:8080
              predicates:
                - Path=/api/products/*/reviews,/api/products/*/reviews/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reviewCircuitBreaker
                    fallbackUri: forward:/fallback/review
            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth
            - id: catalog-service
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/products,/api/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/fallback/catalog
            - id: cart-service
              uri: http://cart-service:8080
              predicates:
                - Path=/api/carts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: cartCircuitBreaker
                    fallbackUri: forward:/fallback/cart
            - id: inventory-service
              uri: http://inventory-service:8080
              predicates:
                - Path=/api/inventory/**
            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/orders,/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/fallback/order
            - id: payment-service
              uri: http://payment-service:8080
              predicates:
                - Path=/api/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentCircuitBreaker
                    fallbackUri: forward:/fallback/payment
            - id: search-service
              uri: http://search-service:8080
              predicates:
                - Path=/search,/search/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: searchCircuitBreaker
                    fallbackUri: forward:/fallback/search
            - id: wishlist-service
              uri: http://wishlist-service:8080
              predicates:
                - Path=/api/wishlist,/api/wishlist/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: wishlistCircuitBreaker
                    fallbackUri: forward:/fallback/wishlist
            - id: fallback-route
              uri: no://op
              predicates:
                - Path=/fallback/**
              filters:
                - StripPrefix=1
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_password}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    gateway:
      enabled: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-development-secret-change-this-to-a-long-random-value}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
